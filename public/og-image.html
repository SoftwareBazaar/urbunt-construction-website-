<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1200px;
            height: 630px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }
        .pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(30deg, #d4772a 12%, transparent 12.5%, transparent 87%, #d4772a 87.5%, #d4772a),
                linear-gradient(150deg, #d4772a 12%, transparent 12.5%, transparent 87%, #d4772a 87.5%, #d4772a),
                linear-gradient(30deg, #d4772a 12%, transparent 12.5%, transparent 87%, #d4772a 87.5%, #d4772a),
                linear-gradient(150deg, #d4772a 12%, transparent 12.5%, transparent 87%, #d4772a 87.5%, #d4772a);
            background-size: 80px 140px;
            background-position: 0 0, 0 0, 40px 70px, 40px 70px;
            opacity: 0.03;
        }
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 60px;
            max-width: 900px;
        }
        .logo {
            width: 280px;
            height: auto;
            margin: 0 auto 40px;
            filter: brightness(1.2);
        }
        h1 {
            font-size: 64px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        .highlight {
            color: #d4772a;
        }
        p {
            font-size: 28px;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-top: 40px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 42px;
            font-weight: 800;
            color: #d4772a;
            display: block;
        }
        .stat-label {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
        }
        .badge {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(212, 119, 42, 0.15);
            border: 2px solid #d4772a;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #d4772a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="pattern"></div>
    <div class="badge">NCA Registered</div>
    <div class="container">
        <img src="/urban-t-logo.png" alt="Urban T Logo" class="logo">
        <h1>From Foundation to Finishing<br><span class="highlight">One Company, Every Trade</span></h1>
        <p>Full-service construction in Nairobi · Transparent BOQ pricing · Fixed timelines</p>
        <div class="stats">
            <div class="stat">
                <span class="stat-value">540+</span>
                <span class="stat-label">Projects</span>
            </div>
            <div class="stat">
                <span class="stat-value">96%</span>
                <span class="stat-label">On-Time</span>
            </div>
            <div class="stat">
                <span class="stat-value">18</span>
                <span class="stat-label">Years</span>
            </div>
        </div>
    </div>
</body>
</html>
